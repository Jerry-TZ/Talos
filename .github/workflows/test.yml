name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is offline and needs no API key, so it is worth running everywhere:
    # Talos is written on Windows and most of its scars are Windows-specific
    # (cmd.exe quirks, CRLF, GBK consoles), but it should still work on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - run: python agent.py --selfcheck
