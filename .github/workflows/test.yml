name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite is offline and needs no API key, so it is worth running everywhere:
    # Talos is written on Windows and most of its scars are Windows-specific
    # (cmd.exe quirks, CRLF, GBK consoles), but it should still work on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - run: python agent.py --selfcheck
      # 这两个脚本 802 行,`tests/` 一行都没碰过它们 —— 唯一的验证就是它们自己的
      # `--selfcheck`,而在这之前那只在我本机、只在 win/py3.10 上跑过。同一天里
      # 一个只在那一格绿的 bug 刚溜进 main(见 FINDINGS 二十六节尾声),
      # **凡是只在我本机跑过的判据,都要当成没跑过。**
      - run: python drawiocheck.py --selfcheck
      - run: python drawio_layout.py --selfcheck
      # agent.py 的守卫变异扫描:40 个变异体 × 一遍全套,约 5 分钟,所以**只跑一格**。
      # 但必须真的跑 —— 它本地默认 skip,而 skip 掉的判据等于不存在
      # (这个仓库为「判据存在 ≠ 判据在被执行」已经付过一次账,就在上面那两行)。
      # 挑 ubuntu:本机永远是 Windows,这一格才是我看不见的那一侧。
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pytest tests/test_mutation.py -q
        env:
          TALOS_SWEEP: "1"
